name: Automatic Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
      - 'build.gradle.kts'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract Project Version
        id: get_version
        run: |
          VERSION=$(grep -E '^\s*version\s*=' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Fat JAR with Shadow
        run: ./gradlew shadowJar -x test

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.PROJECT_VERSION }}
          name: Release v${{ steps.get_version.outputs.PROJECT_VERSION }}
          generate_release_notes: true
          files: build/libs/bookclub-bot.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}